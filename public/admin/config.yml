backend:
  name: github
  repo: socialasadbek/Updaily-site
  branch: main

media_folder: public/uploads
public_folder: /uploads
site_url: https://updaily.uz

collections:
  - name: articles_uz
    label: "Maqolalar — O'zbek (lotin)"
    folder: src/content/articles/uz
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} ({{date}})"
    fields:
      - { label: Sarlavha, name: title, widget: string }
      - { label: "Tarjima kaliti", name: translationKey, widget: string, required: false, hint: "Boshqa tillardagi shu maqola bilan bir xil yozing (masalan: ai-startap-2026). Tillarni bog'laydi." }
      - { label: "Nashr sanasi (Toshkent vaqti)", name: date, widget: datetime, picker_utc: true }
      - { label: Yangilangan sana, name: updated, widget: datetime, picker_utc: true, required: false }
      - { label: Muallif, name: author, widget: relation, collection: authors, search_fields: [name], value_field: "{{slug}}", display_fields: [name], required: false }
      - label: Bo'lim
        name: category
        widget: select
        options: [news, articles, startups, business, investments, technology, research, interviews]
      - { label: Muqova rasmi, name: cover, widget: image, required: false, hint: "16:9 format: 1280×720 px, JPG yoki WebP, 500 KB gacha. Boshqa o'lcham avtomatik 16:9 ga kesiladi." }
      - { label: Rasm tavsifi (alt), name: coverAlt, widget: string, required: false }
      - { label: "Qisqacha (2-3 gap)", name: summary, widget: text, required: false }
      - { label: "Asosiy fikrlar", name: keyPoints, widget: list, required: false, hint: "3-4 ta qisqa band. AI qidiruv va o'quvchi uchun foydali." }
      - { label: Teglar, name: tags, widget: list, required: false }
      - label: Manbalar
        name: sources
        widget: list
        required: false
        fields:
          - { label: Nomi, name: title, widget: string }
          - { label: Havola, name: url, widget: string }
      - { label: "Muhim (bosh sahifa slayderi)", name: featured, widget: boolean, default: false }
      - { label: "Homiylik materiali", name: sponsored, widget: boolean, default: false }
      - { label: Nashr qilingan, name: published, widget: boolean, default: true }
      - { label: SEO sarlavha, name: seoTitle, widget: string, required: false }
      - { label: SEO tavsif, name: seoDescription, widget: text, required: false }
      - { label: Matn, name: body, widget: markdown, hint: "Matnni belgilab havola tugmasini bosing." }

  - name: articles_cyrl
    label: "Maqolalar — Ўзбек (кирилл)"
